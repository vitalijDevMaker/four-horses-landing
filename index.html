<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link
			rel="icon"
			type="image/svg+xml"
			href="/favicon.svg"
		/>
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>Клуб четырех коней</title>
	</head>
	<body>
		<header class="tournament-header">
			<div class="tournament-header__container">
				<div class="container">
					<div class="grid tournament-header__topbar">
						<div class="col-6">
							<img
								src="/src/assets/img/logo.svg"
								alt="4 коня фигуры из шахмат и надпись клуб четырех коней"
								class="tournament-header__logo"
							/>
						</div>
					</div>
					<div class="grid">
						<div class="col-6">
							<h1 class="tournament-header__title">
								<span class="tournament-header__title-main">
									Превратите уездный город
								</span>
								<span class="tournament-header__title-sub">
									в столицу земного шара
								</span>
							</h1>
							<p class="tournament-header__description">
								Оплатите взнос на телеграммы для организации Международного
								васюкинского турнира по шахматам
							</p>
							<div class="tournament-header__actions">
								<button class="btn btn-primary">
									Поддержать шахматную мысль
								</button>
								<button class="btn btn-transparent">Подробнее о турнире</button>
							</div>
						</div>
					</div>
				</div>
			</div>
		</header>
		<script
			type="module"
			src="/src/js/main.js"
		></script>
	</body>
</html>
